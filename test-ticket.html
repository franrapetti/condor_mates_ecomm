<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background: #ccc;
      padding: 50px;
    }
  </style>
</head>
<body>
  <div id="wrapper" style="position: absolute; top: -9999px; left: -9999px; padding: 40px; background: #f7f4ef; display: flex; justify-content: center; align-items: center;">
    <div id="ticket" style="width: 480px; max-width: none; margin: 0; position: relative; transform: none; background: #fffdf8; border-radius: 20px; box-shadow: 0 12px 48px rgba(61, 57, 41, 0.15);">
      
      <div style="padding: 16px 32px; border-top: 2px dashed #e8e2d6;">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 0; color: #234a2e; font-weight: 600;">
          <div style="font-size: 12px;">
            Desc. 10% Efv / Transf.
            <!-- PILL 10% OFF: Absolute positioning -->
            <div style="position: relative; display: inline-block; margin-left: 6px; vertical-align: middle;">
              <!-- Ghost element -->
              <div style="visibility: hidden; font-size: 10px; font-weight: 800; padding: 4px 9px; line-height: 1;">
                10% OFF
              </div>
              <!-- Background -->
              <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #234a2e, #3a7d44); border-radius: 10px;"></div>
              <!-- Text -->
              <div style="position: absolute; top: 4px; left: 0; width: 100%; text-align: center; color: white; font-size: 10px; font-weight: 800; line-height: 1; margin: 0; padding: 0;">
                10% OFF
              </div>
            </div>
          </div>
          <span style="font-size: 13px; font-weight: 700;">-$1,420</span>
        </div>
      </div>

      <div style="text-align: center; padding: 20px 32px 28px; background: linear-gradient(180deg, transparent, rgba(35, 74, 46, 0.03));">
        <div style="font-size: 15px; font-weight: 700; color: #234a2e; margin-bottom: 6px;">¡Gracias por tu compra! 🧉</div>
        
        <!-- PILL @condor_mates: Absolute positioning -->
        <div style="position: relative; display: inline-block; margin-top: 12px;">
          <!-- Ghost element -->
          <div style="visibility: hidden; font-size: 12px; font-weight: 600; padding: 6px 14px; line-height: 1;">
            @condor_mates
          </div>
          <!-- Border -->
          <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; border: 1.5px solid #234a2e; border-radius: 20px;"></div>
          <!-- Text -->
          <div style="position: absolute; top: 6px; left: 0; width: 100%; text-align: center; color: #234a2e; font-size: 12px; font-weight: 600; line-height: 1; margin: 0; padding: 0;">
            @condor_mates
          </div>
        </div>

      </div>
    </div>
  </div>
  <div id="output"></div>
  <script>
    const wrapper = document.getElementById('wrapper');
    wrapper.style.position = 'static';
    wrapper.style.top = '0';
    wrapper.style.left = '0';
    html2canvas(wrapper, {
      scale: 4,
      useCORS: true,
      backgroundColor: '#f7f4ef',
      logging: false,
    }).then(canvas => {
      const dataUrl = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'test-export.png';
      a.id = 'download-link';
      a.textContent = 'Download';
      document.body.appendChild(a);
    });
  </script>
</body>
</html>
